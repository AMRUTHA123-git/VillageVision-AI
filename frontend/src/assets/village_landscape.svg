<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2e28" />
      <stop offset="40%" stop-color="#0f463b" />
      <stop offset="80%" stop-color="#145c4e" />
      <stop offset="100%" stop-color="#1b7362" />
    </linearGradient>

    <!-- Sun / Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Hill Gradients -->
    <linearGradient id="farHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#124e43" />
      <stop offset="100%" stop-color="#0b332c" />
    </linearGradient>

    <linearGradient id="midHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#156455" />
      <stop offset="100%" stop-color="#0a2b25" />
    </linearGradient>

    <linearGradient id="nearHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="900" fill="url(#skyGrad)" />
  <circle cx="950" cy="220" r="180" fill="url(#sunGlow)" />

  <!-- Far Mountains -->
  <path d="M0 480 Q 250 340 500 420 T 1000 380 Q 1120 400 1200 440 L 1200 900 L 0 900 Z" fill="url(#farHills)" opacity="0.9" />

  <!-- Mid Hills & Windmills -->
  <path d="M0 560 Q 300 460 650 520 T 1200 500 L 1200 900 L 0 900 Z" fill="url(#midHills)" opacity="0.95" />

  <!-- Windmill 1 -->
  <g transform="translate(420, 390) scale(0.6)" opacity="0.6">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#a7f3d0" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#ecfdf5" />
    <path d="M0 0 L-10 -40 L5 -42 Z" fill="#6ee7b7" />
    <path d="M0 0 L40 -10 L42 5 Z" fill="#6ee7b7" />
    <path d="M0 0 L-25 35 L-12 40 Z" fill="#6ee7b7" />
  </g>

  <!-- Windmill 2 -->
  <g transform="translate(480, 410) scale(0.45)" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#a7f3d0" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#ecfdf5" />
    <path d="M0 0 L-10 -40 L5 -42 Z" fill="#6ee7b7" />
    <path d="M0 0 L40 -10 L42 5 Z" fill="#6ee7b7" />
    <path d="M0 0 L-25 35 L-12 40 Z" fill="#6ee7b7" />
  </g>

  <!-- Foreground Green Fields -->
  <path d="M0 640 Q 350 580 750 630 T 1200 600 L 1200 900 L 0 900 Z" fill="url(#nearHills)" />

  <!-- Winding Rural Road -->
  <path d="M 450 900 C 500 780, 680 750, 720 680 C 740 645, 730 630, 750 630 L 760 630 C 740 645, 710 685, 520 900 Z" fill="url(#roadGrad)" opacity="0.8" />
  
  <!-- Solar Panels / Tech Nodes (Smart Village representation) -->
  <g transform="translate(180, 640) rotate(-5)" opacity="0.7">
    <rect x="0" y="0" width="70" height="40" fill="#0284c7" rx="3" stroke="#e0f2fe" stroke-width="1.5" />
    <line x1="23.3" y1="0" x2="23.3" y2="40" stroke="#e0f2fe" stroke-width="1" />
    <line x1="46.6" y1="0" x2="46.6" y2="40" stroke="#e0f2fe" stroke-width="1" />
    <line x1="0" y1="20" x2="70" y2="20" stroke="#e0f2fe" stroke-width="1" />
  </g>

  <!-- Village Houses Silhouettes -->
  <!-- House 1 -->
  <g transform="translate(600, 610) scale(0.85)">
    <!-- Main Body -->
    <rect x="0" y="20" width="60" height="40" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <!-- Slanted Roof -->
    <polygon points="-10,20 30,-5 70,20" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <!-- Door -->
    <rect x="22" y="36" width="16" height="24" fill="#34d399" opacity="0.8" />
    <!-- Window -->
    <rect x="8" y="28" width="10" height="10" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- House 2 -->
  <g transform="translate(680, 625) scale(0.7)">
    <rect x="0" y="20" width="55" height="35" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <polygon points="-8,20 27.5,-5 63,20" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="20" y="34" width="14" height="21" fill="#34d399" opacity="0.8" />
  </g>

  <!-- Trees -->
  <!-- Tree 1 -->
  <g transform="translate(140, 600)">
    <rect x="18" y="40" width="8" height="30" fill="#064e3b" />
    <circle cx="22" cy="35" r="24" fill="#10b981" opacity="0.85" />
    <circle cx="10" cy="40" r="18" fill="#059669" opacity="0.9" />
    <circle cx="34" cy="40" r="18" fill="#047857" opacity="0.9" />
  </g>

  <!-- Tree 2 -->
  <g transform="translate(850, 580) scale(1.2)">
    <rect x="18" y="40" width="8" height="35" fill="#064e3b" />
    <circle cx="22" cy="30" r="28" fill="#34d399" opacity="0.8" />
    <circle cx="8" cy="38" r="20" fill="#10b981" opacity="0.85" />
    <circle cx="36" cy="38" r="20" fill="#059669" opacity="0.85" />
  </g>
</svg>
